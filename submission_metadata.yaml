ai_usage_summary: |
  Used an advanced AI agent (Antigravity running Gemini 3.1 Pro for reasoning | and Claude opus 4.6 for building) for deep dataset forensics, feature engineering, and pipeline coding. The agent autonomously analyzed the dataset, identified synthetic honeypots (impossible skill durations), implemented a TF-IDF semantic layer against the JD, and built the final expert ranking system. No candidate data was sent to an LLM for runtime scoring; the AI was used entirely during the development and coding phase to build a deterministic, CPU-bound Python script.

methodology_summary: |
  Deterministic Rule-Based Expert System combined with lightweight Semantic TF-IDF matching. The ranker extracts 50+ explicit signals (retrieval experience, vector databases, production scaling) to generate a dense technical score. We identified that the dataset is synthetically generated with anomalous 'impossible' skill durations. To prevent penalizing elite candidates, we relaxed the honeypot duration filter while enforcing strict Domain (no pure CV/Robotics) and Years of Experience (3.5-15) bounds. Runtime is <3 minutes for 100k candidates on pure CPU.

declarations:
  read_submission_spec: true
